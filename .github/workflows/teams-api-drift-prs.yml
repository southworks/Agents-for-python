name: Teams API Drift Detector
on:
  pull_request:
    branches: [main, "release/*"]
    paths:
      - libraries/microsoft-agents-hosting-msteams/setup.py
      - libraries/microsoft-agents-hosting-msteams/teams-api-usage-manifest.json
      - libraries/microsoft-agents-hosting-msteams/config/teams-capabilities.yaml
      - scripts/teams-api-drift/**
      - tests/teams_api_drift/**
      - tests/hosting_msteams/test_api_boundaries.py
      - .github/workflows/teams-api-drift-*.yml
  workflow_dispatch:
    inputs:
      from:
        description: Exact baseline microsoft-teams-api version
        required: true
        type: string
      to:
        description: Exact candidate microsoft-teams-api version
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  copilot-requests: write
concurrency:
  group: teams-api-drift-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      from: ${{ steps.scope.outputs.from }}
      to: ${{ steps.scope.outputs.to }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/teams-api-drift/requirements.txt "pydantic>=2,<3"
      - name: Run offline tooling tests
        run: python -m pytest tests/teams_api_drift -o asyncio_default_fixture_loop_scope=function
      - name: Check tooling formatting
        run: python -m black --check scripts/teams-api-drift tests/teams_api_drift tests/hosting_msteams/test_api_boundaries.py
      - id: scope
        name: Resolve declared dependency change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: python scripts/teams-api-drift/teams-api-drift.py scope --mode pr
  analyze:
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}

    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRIFT_MODE: pr
      INPUT_FROM: ${{ needs.scope.outputs.from }}
      INPUT_TO: ${{ needs.scope.outputs.to }}
      IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/teams-api-drift/requirements.txt
      - name: Install analysis tooling
        run: python -m pip install -r scripts/teams-api-drift/requirements.txt
      - id: analyze
        name: Collect deterministic comparison and candidate verification
        if: ${{ success() }}
        run: python scripts/teams-api-drift/teams-api-drift.py analyze --mode "$DRIFT_MODE"
        continue-on-error: true
      - id: context
        name: Prepare bounded advisory context
        if: ${{ always() && steps.analyze.outcome == 'success' }}
        run: python scripts/teams-api-drift/teams-api-drift.py context --mode "$DRIFT_MODE"
        continue-on-error: true
      - name: Set up Node for Copilot CLI
        if: ${{ steps.context.outputs.ready == 'true' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - id: install
        name: Install GitHub Copilot CLI
        if: ${{ steps.context.outputs.ready == 'true' }}
        run: npm install --global @github/copilot
        continue-on-error: true
      - id: generate
        name: Generate advisory report
        if: ${{ steps.install.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          prompt = Path("scripts/teams-api-drift/teams-api-agent-report-prompt.md").read_text()
          context = Path("artifacts/teams-api-drift/agent-context.json").read_text()
          with tempfile.TemporaryDirectory(prefix="teams-api-advisory-") as working_directory, Path("artifacts/teams-api-drift/agent-report.md").open("w") as output:
              subprocess.run(
                  ["copilot", "-s", "-p", prompt + "\n## Runtime context\n\n" + context,
                   "--deny-tool=shell,write,read,url,memory,github", "--no-ask-user"],
                  stdout=output, check=True, timeout=600, cwd=working_directory,
              )
          PY
        continue-on-error: true
      - id: validate
        name: Validate advisory report against deterministic findings
        if: ${{ steps.generate.outcome == 'success' }}
        run: python scripts/teams-api-drift/teams-api-drift.py validate
        continue-on-error: true
      - name: Upload all available evidence before enforcing policy
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: teams-api-drift-pr-${{ github.run_id }}
          path: artifacts/teams-api-drift
          retention-days: 21
          if-no-files-found: warn
      - name: Publish maintainer report
        if: ${{ always() && steps.analyze.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/teams-api-drift/teams-api-drift.py publish --mode "$DRIFT_MODE"
      - name: Enforce final drift policy
        if: ${{ always() }}
        env:
          AI_CONTEXT_OUTCOME: ${{ steps.context.outcome }}
          AI_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AI_GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          AI_VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: python scripts/teams-api-drift/teams-api-drift.py policy --mode "$DRIFT_MODE"
